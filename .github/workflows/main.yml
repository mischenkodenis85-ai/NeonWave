name: Build NeonWave APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NeonWave_Android_Project_Updated.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: |
          unzip NeonWave_Android_Project_Updated.zip -d project
          ls -la project/neonwave_music

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"

      - name: Build APK
        run: |
          cd project/neonwave_music
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonWave-debug-apk
          path: project/neonwave_music/app/build/outputs/apk/debug/*.apk
